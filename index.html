<style>
/* App de bolsillo: cabecera de orden de trabajo, contenido en tarjetas, barra inferior fija; marcas de registro CMYK como sello */
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#eceef5;--ink:#161a2e;--muted:#5a6078;--line:#d9dce8;
  --cyan:#0b86ad;--magenta:#c8226a;--yellow:#e8b300;--ok:#1f8a4c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10121c;--surface:#181b29;--surface2:#222638;--ink:#eceef7;--muted:#a2a7c0;--line:#2f344a;
  --cyan:#3fb6dc;--magenta:#f0569a;--yellow:#f2c53d;--ok:#4cc27e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.reg{display:inline-flex;gap:3px}.reg i{width:8px;height:8px;border-radius:50%;display:block}
.reg i:nth-child(1){background:var(--cyan)}.reg i:nth-child(2){background:var(--magenta)}.reg i:nth-child(3){background:var(--yellow)}.reg i:nth-child(4){background:var(--ink)}
.brand{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em;margin-top:8px}
.brand span{color:var(--magenta)}
.lede{color:var(--muted);margin:8px 0 0}
.search{margin-top:18px;display:grid;gap:6px}
.search label{font-weight:700}
.search input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font:inherit;color:inherit}
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:600;font-size:14px}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px}
.bar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .4s}
.prog small{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod{margin-top:26px}
.modh{display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
.modh .k{font-family:var(--mono);font-size:12px;color:var(--magenta)}
.modh h2{font-size:20px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;text-decoration:none;color:inherit}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:700}
.row.done .dot{background:var(--ok);border-color:var(--ok)}
.row h3{font-family:var(--body);font-size:16px;font-weight:600}
.row .meta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.back{border:0;background:none;padding:6px 0;color:var(--muted);font-weight:600}
.title{font-size:28px;font-weight:800;margin-top:6px;line-height:1.1}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;display:grid;gap:10px}
.box b.lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px}
ol.steps li::marker{font-family:var(--mono);color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;background:var(--surface);text-decoration:none;color:inherit}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.go{background:var(--cyan);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.stack{display:grid;gap:10px;margin-top:18px}
/* modo guía */
.guide{display:grid;gap:18px;margin-top:8px}
.stepn{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px}.pips i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}.pips i.on{background:var(--magenta)}
.bigstep{font-size:22px;line-height:1.4;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.final{text-align:center;display:grid;gap:12px;justify-items:center}
.final .big{font-size:56px;line-height:1}
/* apps y plantillas */
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--cyan);color:#fff;border-color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px}
.card .cat{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.card h3{font-size:19px}
.card p{margin:0}
.tip{font-size:14px;border-left:3px solid var(--yellow);padding-left:8px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:10px;padding:12px;font-family:var(--mono);font-size:13px;margin:0;max-height:300px;overflow:auto}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabbar a{display:grid;justify-items:center;gap:2px;padding:10px 4px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
nav.tabbar a svg{width:22px;height:22px}
nav.tabbar a[aria-current="page"]{color:var(--magenta)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted);margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.install{margin-top:14px;display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px}
.install button{border:0;background:var(--magenta);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

s de clientes y tareas."}], "titulo": "Organizar varias empresas sin perderte", "id": "organizar-clientes"}, {"apps": ["meta-business-suite"], "claves": "anuncio pauta publicidad ads promocionar campaña presupuesto", "duracion": "30 min", "entregable": "Anuncio activo con presupuesto aprobado y costo por resultado anotado.", "modulo": "Publicidad pagada y reportes", "objetivo": "Promocionar una publicación con poco presupuesto y medir resultados.", "orden": 17, "pasos": [{"link": "", "texto": "Pide siempre la autorización escrita del cliente con el monto máximo antes de gastar."}, {"link": "https://business.facebook.com", "texto": "Lo más simple: en Meta Business Suite elige una publicación que ya funcionó y toca 'Promocionar'."}, {"link": "", "texto": "Elige objetivo (mensajes, visitas al perfil o tráfico), público por comuna y edad, presupuesto diario y duración."}, {"link": "https://adsmanager.facebook.com", "texto": "Para campañas más completas usa el Administrador de anuncios."}, {"link": "", "texto": "Revisa a las 48 horas el costo por resultado y anota qué aprendiste."}], "titulo": "Crear un anuncio simple en Meta Ads", "id": "primer-anuncio"}, {"apps": ["meta-business-suite", "metricool", "buffer"], "claves": "programar publicar agendar post metricool meta business", "duracion": "20 min", "entregable": "Semana programada; captura del calendario de Meta Business Suite o Metricool.", "modulo": "Community manager en el día a día", "objetivo": "Dejar todo el contenido de la semana programado de una sola vez.", "orden": 14, "pasos": [{"link": "https://business.facebook.com", "texto": "Abre Meta Business Suite y elige la cuenta del cliente arriba a la izquierda."}, {"link": "", "texto": "Toca 'Crear publicación' (o 'Crear reel' para videos), marca Facebook e Instagram y sube la imagen o el video."}, {"link": "", "texto": "Pega el copy del calendario y, en 'Opciones de programación', elige fecha y hora. Toca 'Programar'."}, {"link": "https://metricool.com/es/", "te nombre": "Looker Studio", "para": "Tableros de reportes que se actualizan solos.", "tip": "Conecta una planilla de Google Sheets con tus métricas mensuales.", "id": "looker-studio"}, {"categoria": "Gestión de redes", "gratis": "Gratis.", "link": "https://business.facebook.com", "nombre": "Meta Business Suite", "para": "Programar publicaciones de Facebook e Instagram, responder mensajes y ver estadísticas.", "tip": "Es la herramienta oficial: úsala para recibir accesos de clientes sin contraseñas.", "id": "meta-business-suite"}, {"categoria": "Gestión de redes", "gratis": "Plan gratis con límite de marcas y funciones; revisa los límites actuales.", "link": "https://metricool.com/es/", "nombre": "Metricool", "para": "Planificar y analizar varias redes (Instagram, Facebook, TikTok, LinkedIn y más) en un solo lugar.", "tip": "Ideal cuando llevas TikTok o LinkedIn además de Meta.", "id": "metricool"}, {"categoria": "Organización", "gratis": "Plan gratis para uso personal; los estudiantes pueden tener beneficios.", "link": "https://www.notion.so", "nombre": "Notion", "para": "Armar tu oficina digital: clientes, tareas, notas y calendarios.", "tip": "Empieza con una plantilla de 'gestión de clientes' y simplifícala.", "id": "notion"}, {"categoria": "Imágenes y video", "gratis": "Gratis.", "link": "https://www.pexels.com/es-es/", "nombre": "Pexels", "para": "Fotos y videos de stock gratis para usar en redes.", "tip": "Prefiere fotos reales del cliente; usa stock solo de apoyo.", "id": "pexels"}, {"categoria": "Diseño", "gratis": "Gratis en resolución baja; alta resolución con créditos.", "link": "https://www.remove.bg/es", "nombre": "remove.bg", "para": "Quitar el fondo de una foto o logo en segundos.", "tip": "Canva también quita fondos, pero solo en su plan de pago.", "id": "remove-bg"}, {"categoria": "Investigación", "gratis": "Gratis.", "link": "https://ads.tiktok.com/business/creativecenter", "nombre": "TikTok Creative Center", "para": "Ver tendencias, sonidos y anunci \nD — DESEO (beneficio):\n   Cómo se ve su vida con tu solución.\nA — ACCIÓN (llamado claro):\n   Escríbenos al WhatsApp / Guarda este post / Reserva hoy.\n+ 5 a 10 hashtags (rubro + comuna + marca)", "orden": 5, "tipo": "Contenido", "titulo": "Fórmula de copy AIDA", "id": "aida"}, {"contenido": "BRIEF DE CLIENTE\n1. Nombre del negocio, rubro y comuna:\n2. ¿Qué vendes? Tus 3 productos o servicios principales:\n3. ¿Quién es tu cliente ideal? (edad, comuna, qué le preocupa)\n4. ¿Qué te diferencia de la competencia?\n5. Nombra 2 o 3 competidores:\n6. ¿Qué quieres lograr en los próximos 3 meses?\n7. Redes que tienes hoy (con enlace) y quién las maneja:\n8. ¿Tienes logo, colores y tipografías? (adjuntar)\n9. Datos de contacto para publicar (WhatsApp, dirección, horario):\n10. Cosas que NO quieres que se publiquen:\n11. Presupuesto mensual para publicidad pagada (si hay):\n12. ¿Quién aprueba las publicaciones y por qué medio?", "orden": 1, "tipo": "Estrategia", "titulo": "Brief de cliente", "id": "brief"}, {"contenido": "COLUMNAS PARA GOOGLE SHEETS\nFecha | Día | Red | Pilar | Formato (imagen/carrusel/Reel/historia) | Tema | Gancho | Copy | Llamado a la acción | Hashtags | Responsable | Estado (Idea/Texto listo/Producción/Revisión/Aprobado/Publicado) | Enlace al archivo | Alcance | Interacciones | Notas", "orden": 4, "tipo": "Estrategia", "titulo": "Calendario mensual (columnas)", "id": "calendario"}, {"contenido": "☐ Gancho en la primera línea o en los primeros 3 segundos\n☐ Logo y colores del cliente\n☐ Sin faltas de ortografía (revisa nombres propios)\n☐ Datos correctos: WhatsApp, dirección, horario\n☐ Precios o promociones aprobados por el cliente\n☐ Personas que aparecen tienen autorización (menores: autorización escrita de sus padres)\n☐ Subtítulos en videos\n☐ Llamado a la acción claro\n☐ Aprobado por el cliente por escrito", "orden": 8, "tipo": "Calidad", "titulo": "Checklist antes de publicar", "id": "checklist"}, {"contenido": "BUYER PERSONA\nNombre ficticio:\nEdad / comuna / ocupación:\n¿Qué le preocupa o qué problema tiene?\n¿Qué quiere lograr?\n¿Qué redes usa y a qué hora?\n¿Qué le impide comprar? (precio, confianza, distancia)\n¿Qué lo convence? (testimonios, garantía, rapidez)\nFrase que diría:", "orden": 3, "tipo": "Estrategia", "titulo": "Buyer persona", "id": "persona"}, {"contenido": "PROPUESTA DE SERVICIOS — [Nombre del cliente]\n1. Diagnóstico breve: qué vimos en sus redes y en la competencia.\n2. Objetivo: [objetivo SMART].\n3. Qué haremos:\n   - Plan mensual de contenido\n   - [N] publicaciones al mes (imágenes, carruseles y Reels)\n   - Historias: [N] por semana\n   - Respuesta de mensajes y comentarios en horario hábil\n   - Reporte mensual\n4. Qué NO incluye: presupuesto de publicidad pagada, sesiones de fotos, [otros].\n5. Plazos: inicio [fecha], entrega del calendario [fecha].\n6. Inversión mensual: $[monto] + forma de pago.\n7. Rondas de corrección incluidas: 2 por pieza.\n8. Contacto: [tu nombre, WhatsApp, correo]", "orden": 2, "tipo": "Comercial", "titulo": "Propuesta y cotización", "id": "propuesta"}, {"contenido": "GUION DE REEL\n0-3 s  GANCHO: frase o imagen que detiene el scroll.\n3-20 s DESARROLLO: 2 o 3 ideas cortas, un plano por idea.\n20-30 s CIERRE: llamado a la acción + logo.\nTexto en pantalla:\nAudio o música (de tendencia, sin derechos de autor):\nPlano y lugar de grabación:\nDuración final:", "orden": 6, "tipo": "Contenido", "titulo": "Guion de Reel de 15 a 30 segundos", "id": "reel"}, {"contenido": "REPORTE MENSUAL — [Cliente] — [Mes]\n1. Resumen en 3 líneas.\n2. KPIs vs meta: Alcance | Interacciones | Seguidores nuevos | Mensajes o clics\n3. Las 3 mejores publicaciones (por qué funcionaron).\n4. Publicidad pagada: inversión, resultados y costo por resultado.\n5. 3 aprendizajes.\n6. 3 acciones para el próximo mes.", "orden": 9, "tipo": "Métricas", "titulo": "Reporte mensual", "id": "reporte"}, {"contenido": "PRECIO: ¡Hola [nombre]! Gracias por escribirnos 😊 Te enviamos el detalle por mensaje privado.\nHORARIO: ¡Hola! Atendemos de [días] de [hora] a [hora]. Te esperamos en [dirección].\nRECLAMO: Hola [nombre], lamentamos lo ocurrido. Escríbenos por mensaje privado para ayudarte lo antes posible.\nFELICITACIÓN: ¡Muchas gracias [nombre]! Nos alegra mucho que te haya gustado 🙌\nFUERA DE HORARIO: ¡Gracias por escribir! Te responderemos el [día] desde las [hora].", "orden": 7, "tipo": "Community", "titulo": "Respuestas tipo para comunidad", "id": "respuestas"}]};
const WA = "56948627767";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const L = [...DATA.lecciones].sort((a,b)=>a.orden-b.orden);
const APPS = DATA.apps, TPL = [...DATA.plantillas].sort((a,b)=>a.orden-b.orden);
const MODS = []; L.forEach(l=>{let m=MODS.find(x=>x.n===l.modulo); if(!m) MODS.push(m={n:l.modulo,items:[]}); m.items.push(l)});
let done = {}; try{ done = JSON.parse(localStorage.getItem("mpc-done")||"{}") }catch(e){}
const save = () => { try{ localStorage.setItem("mpc-done", JSON.stringify(done)) }catch(e){} };
let query = "", appCat = "Todas", deferredInstall = null;

function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200) }
const host = u => { try{ return new URL(u).hostname.replace(/^www\./,"") }catch(e){ return "" } };
function appForLink(link, lesson){
  const h = host(link); if(!h) return null;
  const own = (lesson?.apps||[]).map(id=>APPS.find(a=>a.id===id)).filter(Boolean);
  return own.find(a=>host(a.link)===h) || APPS.find(a=>host(a.link)===h)
    || own.find(a=>{ const ah=host(a.link); return h.endsWith("."+ah) || ah.endsWith("."+h) }) || null;
}
function progTxt(){ const d=L.filter(l=>done[l.id]).length; return {d, n:L.length, pct: L.length? d/L.length*100 : 0} }

function viewHome(){
  const q = norm(query);
  const match = l => !q || norm([l.titulo,l.objetivo,l.modulo,l.claves,(l.pasos||[]).map(p=>p.texto).join(" ")].join(" ")).includes(q);
  const p = progTxt();
  const quick = [["Conectar redes","conectar"],["Crear imagen","imagen"],["Editar video","video"],["Programar posts","programar"],["Responder mensajes","responder"],["Hacer reporte","reporte"],["Cobrar","cobro"]];
  let html = `
    <div class="eyebrow"><span class="reg"><i></i><i></i><i></i><i></i></span>Escuela de iniciación al marketing</div>
    <h1 class="brand">Mi Primer <span>Click</span> MKT</h1>
    <p class="lede">Aprende a hacer trabajos de agencia y community manager con apps gratis, paso a paso.</p>
    ${deferredInstall?`<div class="install"><span>Instálala en tu celular para abrirla como app.</span><button id="btnInstall">Instalar</button></div>`:""}
    <div class="search"><label for="q">¿Qué necesitas hacer hoy?</label>
      <input id="q" type="search" value="${esc(query)}" placeholder="Ej: conectar redes, crear imagen, programar…" autocomplete="off"></div>
    <div class="quick">${quick.map(([t,k])=>`<button data-q="${k}">${t}</button>`).join("")}</div>
    <div class="prog"><div class="bar"><b style="width:${p.pct}%"></b></div><small>${p.d}/${p.n} guías</small></div>`;
  let any = false;
  MODS.forEach((m,i)=>{
    const items = m.items.filter(match); if(!items.length) return; any = true;
    html += `<section class="mod"><div class="modh"><span class="k">M${i+1}</span><h2>${esc(m.n)}</h2></div><div class="list">${
      items.map(l=>`<a class="row ${done[l.id]?"done":""}" href="#/l/${l.id}"><span class="dot">${done[l.id]?"✓":""}</span><h3>${esc(l.titulo)}</h3><span class="meta">${esc(l.duracion)}</span></a>`).join("")}</div></section>`;
  });
  if(!any) html += `<div class="empty">No hay una guía para eso todavía.<br><a href="https://wa.me/${WA}?text=${encodeURIComponent("Hola, me gustaría una guía en Mi Primer Click MKT sobre: "+query)}" target="_blank" rel="noopener">Pídela por WhatsApp ↗</a></div>`;
  return html;
}
function viewLesson(id){
  const l = L.find(x=>x.id===id); if(!l) return `<div class="empty">No encontré esa guía.</div>`;
  const apps = (l.apps||[]).map(a=>APPS.find(x=>x.id===a)).filter(Boolean);
  return `<button class="back" data-back>← Volver</button>
    <div class="eyebrow">${esc(l.modulo)} · ${esc(l.duracion)}</div>
    <h1 class="title">${esc(l.titulo)}</h1>
    <p class="muted">${esc(l.objetivo)}</p>
    <div class="stack"><a class="btn go" href="#/g/${l.id}/1">Empezar paso a paso →</a></div>
    <div class="box"><b class="lab">Los ${l.pasos.length} pasos</b><ol class="steps">${l.pasos.map(p=>`<li>${esc(p.texto)}</li>`).join("")}</ol></div>
    ${apps.length?`<div class="box"><b class="lab">Apps que usarás</b><div class="chips">${apps.map(a=>`<a class="chip" href="#/apps/${a.id}">${esc(a.nombre)}</a>`).join("")}</div></div>`:""}
    <div class="box"><b class="lab">Entregable</b><div>${esc(l.entregable)}</div></div>
    <div class="stack"><button class="btn ${done[l.id]?"ghost":"ok"}" data-toggle="${l.id}">${done[l.id]?"Marcar como pendiente":"Marcar como completada"}</button></div>`;
}
function viewGuide(id, n){
  const l = L.find(x=>x.id===id); if(!l) return viewLesson(id);
  const total = l.pasos.length;
  if(n > total){
    return `<div class="final" style="margin-top:30px"><div class="big">🎉</div><h1 class="title">¡Guía terminada!</h1>
      <div class="box" style="text-align:left;width:100%"><b class="lab">Tu entregable</b><div>${esc(l.entregable)}</div></div>
      <div class="stack" style="width:100%"><button class="btn ok" data-finish="${l.id}">Marcar como completada</button>
      <a class="btn ghost" href="#/g/${l.id}/${total}">← Volver al último paso</a></div></div>`;
  }
  const p = l.pasos[n-1], app = appForLink(p.link, l);
  return `<button class="back" data-go="#/l/${l.id}">✕ Salir de la guía</button>
    <div class="guide">
      <div class="pips">${l.pasos.map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>
      <div class="stepn">${esc(l.titulo)} · Paso ${n} de ${total}</div>
      <div class="bigstep">${esc(p.texto)}</div>
      <div class="stack" style="margin-top:0">
        ${p.link?`<a class="btn go" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir ${esc(app?app.nombre:host(p.link))} ↗</a>`:""}
        <a class="btn" href="#/g/${l.id}/${n+1}">${n===total?"Terminar ✓":"Listo, siguiente →"}</a>
        ${n>1?`<a class="btn ghost" href="#/g/${l.id}/${n-1}">← Paso anterior</a>`:""}
      </div>
      ${p.link?`<p class="muted" style="font-size:14px;margin:0">La app se abre en otra pestaña. Cuando termines, vuelve aquí y toca "Listo".</p>`:""}
    </div>`;
}
function viewApps(focus){
  const cats = ["Todas",...new Set(APPS.map(a=>a.categoria))];
  const list = APPS.filter(a=>appCat==="Todas"||a.categoria===appCat).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return `<h1 class="title">Apps gratis</h1><p class="muted">Revisa siempre los límites actuales del plan gratis en la web de cada app.</p>
    <div class="filters">${cats.map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===appCat}">${esc(c)}</button>`).join("")}</div>
    <div class="list">${list.map(a=>`<article class="card" id="app-${a.id}" ${focus===a.id?'style="border-color:var(--magenta)"':""}><span class="cat">${esc(a.categoria)}</span><h3>${esc(a.nombre)}</h3><p>${esc(a.para)}</p><p class="muted" style="font-size:14px">${esc(a.gratis)}</p><p class="tip">${esc(a.tip)}</p><a class="btn go" style="margin-top:6px;padding:12px" href="${esc(a.link)}" target="_blank" rel="noopener">Abrir ${esc(a.nombre)} ↗</a></article>`).join("")}</div>`;
}
function viewTpl(){
  return `<h1 class="title">Plantillas</h1><p class="muted">Toca "Copiar" y pégala en Google Docs, Sheets o en tu chat con la IA.</p>
    <div class="list" style="margin-top:12px">${TPL.map(t=>`<article class="card"><span class="cat">${esc(t.tipo)}</span><h3>${esc(t.titulo)}</h3><pre id="tpl-${t.id}">${esc(t.contenido)}</pre><button class="btn ghost" style="padding:12px" data-copy="${t.id}">Copiar plantilla</button></article>`).join("")}</div>`;
}
function viewAvance(){
  const p = progTxt();
  return `<h1 class="title">Mi avance</h1>
    <div class="prog"><div class="bar"><b style="width:${p.pct}%"></b></div><small>${p.d}/${p.n} guías</small></div>
    <div class="list" style="margin-top:16px">${MODS.map((m,i)=>{const d=m.items.filter(l=>done[l.id]).length;return `<div class="card"><span class="cat">Módulo ${i+1}</span><h3>${esc(m.n)}</h3><div class="prog" style="margin-top:4px"><div class="bar"><b style="width:${d/m.items.length*100}%"></b></div><small>${d}/${m.items.length}</small></div></div>`}).join("")}</div>
    <p class="muted" style="font-size:14px;margin-top:16px">Tu avance se guarda en este celular.</p>
    <div class="stack"><a class="btn ghost" href="https://wa.me/${WA}?text=${encodeURIComponent("Hola, tengo una duda sobre Mi Primer Click MKT: ")}" target="_blank" rel="noopener">Enviar una duda o sugerencia por WhatsApp ↗</a>
    <button class="btn ghost" data-reset>Borrar mi avance</button></div>`;
}

function render(){
  const h = location.hash.replace(/^#\/?/,"").split("/");
  let html, nav="home";
  if(h[0]==="l") html=viewLesson(h[1]);
  else if(h[0]==="g") html=viewGuide(h[1], Math.max(1, parseInt(h[2])||1));
  else if(h[0]==="apps"){ nav="apps"; if(h[1]) appCat="Todas"; html=viewApps(h[1]); }
  else if(h[0]==="plantillas"){ nav="plantillas"; html=viewTpl(); }
  else if(h[0]==="avance"){ nav="avance"; html=viewAvance(); }
  else html=viewHome();
  $("#app").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.dataset.nav===nav ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if(h[0]==="apps" && h[1]) document.getElementById("app-"+h[1])?.scrollIntoView({block:"center"});
  else if(h[0]!=="" || !query) window.scrollTo(0,0);
}
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-q],[data-back],[data-go],[data-toggle],[data-finish],[data-cat],[data-copy],[data-reset],#btnInstall");
  if(!t) return;
  if(t.dataset.q!==undefined){ query=t.dataset.q; render(); $("#q")?.focus(); }
  else if(t.dataset.back!==undefined){ location.hash="#/"; }
  else if(t.dataset.go){ location.hash=t.dataset.go; }
  else if(t.dataset.toggle){ const id=t.dataset.toggle; if(done[id]) delete done[id]; else done[id]=true; save(); toast(done[id]?"Guía completada ✓":"Marcada como pendiente"); render(); }
  else if(t.dataset.finish){ done[t.dataset.finish]=true; save(); toast("¡Bien! Guía completada ✓"); location.hash="#/"; }
  else if(t.dataset.cat){ appCat=t.dataset.cat; render(); }
  else if(t.dataset.copy){ const pre=document.getElementById("tpl-"+t.dataset.copy); try{ await navigator.clipboard.writeText(pre.textContent); toast("Plantilla copiada"); }catch(err){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto seleccionado: cópialo"); } }
  else if(t.dataset.reset!==undefined){ if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="¿Seguro? Toca de nuevo para borrar"; return } done={}; save(); toast("Avance borrado"); render(); }
  else if(t.id==="btnInstall" && deferredInstall){ deferredInstall.prompt(); deferredInstall=null; render(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ query=e.target.value; const pos=e.target.selectionStart; clearTimeout(render.t); render.t=setTimeout(()=>{ render(); const i=$("#q"); if(i){ i.focus(); i.setSelectionRange(pos,pos);} },180); } });
window.addEventListener("hashchange", render);
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall=e; if(!location.hash||location.hash==="#/") render(); });
render();
if("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
